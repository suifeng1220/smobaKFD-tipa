<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>P3 · 玻璃板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#040506;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;color:#EFF1F5}
.phone{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;
  box-shadow:0 50px 130px -30px #000,0 0 0 1px rgba(255,255,255,.07)}
.wall{position:absolute;inset:-10%;background:
  radial-gradient(64% 44% at 24% 4%,rgba(96,104,140,.5),transparent 64%),
  radial-gradient(56% 38% at 86% 10%,rgba(120,84,50,.34),transparent 62%),
  radial-gradient(80% 50% at 50% 104%,rgba(30,36,54,.7),transparent 68%),
  linear-gradient(170deg,#0C0D11,#070809 52%,#040506)}
.wall:after{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(120deg,rgba(255,255,255,.022) 0 1px,transparent 1px 19px)}
.app{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 15px}

/* 顶栏 */
.hd{flex:none;height:66px;display:flex;align-items:center;gap:9px;padding:0 2px}
.hd .d{width:7px;height:7px;border-radius:50%;background:#4A505E;transition:.3s}
.hd .d.on{background:#E9A94B;box-shadow:0 0 0 3px rgba(233,169,75,.14),0 0 10px rgba(233,169,75,.8)}
.hd .nm{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.hd .sp{flex:1}
.fold{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#9AA0AE;transition:.18s}
.fold:active{transform:scale(.9)}

.main{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:22px;
  display:flex;flex-direction:column}
.main>.slab,.main>.acts{flex:none}
.main::-webkit-scrollbar{display:none}

/* 大玻璃板 */
.slab{border-radius:22px;padding:19px 19px 4px;margin-bottom:12px;
  background:linear-gradient(172deg,rgba(44,47,58,.62),rgba(19,21,27,.8));
  border:1px solid rgba(255,255,255,.085);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 22px 44px -34px #000;
  backdrop-filter:blur(26px) saturate(130%);-webkit-backdrop-filter:blur(26px) saturate(130%)}
.slab.live{background:linear-gradient(172deg,rgba(44,41,34,.66),rgba(21,20,17,.84));
  border-color:rgba(233,169,75,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 20px 44px -34px rgba(233,169,75,.4)}
.k{font-size:9.5px;font-weight:660;letter-spacing:.13em;color:#666D7C}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.big{font-size:36px;font-weight:250;letter-spacing:-.045em;line-height:1.06;margin-top:11px;color:#9BA1AF;transition:.26s}
.slab.live .big{color:#FFF6E8}

.sw{width:52px;height:30px;border-radius:16px;flex:none;position:relative;cursor:pointer;margin-top:13px;
  background:rgba(255,255,255,.11);box-shadow:inset 0 1px 3px rgba(0,0,0,.42);transition:background .26s}
.sw i{position:absolute;top:2.5px;left:2.5px;width:25px;height:25px;border-radius:50%;background:#EDEFF3;
  box-shadow:0 2px 6px rgba(0,0,0,.45);transition:transform .3s cubic-bezier(.36,1.42,.52,1)}
.sw.on{background:#E9A94B;box-shadow:inset 0 1px 2px rgba(0,0,0,.16),0 0 20px rgba(233,169,75,.45)}
.sw.on i{transform:translateX(22px)}

.hint{margin-top:12px;font-size:11px;color:#6C7382;letter-spacing:-.005em}

/* 板内 KV */
.kv{border-top:1px solid rgba(255,255,255,.07);margin-top:17px}
.kv .r{display:flex;align-items:center;justify-content:space-between;gap:12px;height:44px;
  border-bottom:1px solid rgba(255,255,255,.055)}
.kv .r:last-child{border-bottom:0}
.kv .r span{font-size:12px;color:#7B8290}
.kv .r b{font-size:12px;font-weight:560;color:#C6CBD6;font-variant-numeric:tabular-nums}
.kv .r b.ok{color:#5FD8A4}

/* 操作板 */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:12px}
.act{height:96px;border-radius:20px;padding:15px 15px 14px;display:flex;flex-direction:column;justify-content:space-between;
  cursor:pointer;text-align:left;border:1px solid rgba(255,255,255,.085);transition:.16s;
  background:linear-gradient(172deg,rgba(44,47,58,.6),rgba(19,21,27,.8));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.075);backdrop-filter:blur(22px)}
.act:active{transform:scale(.975)}
.act.primary{background:linear-gradient(172deg,#F0B458,#D99233);border-color:rgba(255,214,150,.42);
  box-shadow:0 18px 38px -22px rgba(233,169,75,.85),inset 0 1px 0 rgba(255,255,255,.4)}
.act .ic{color:#9AA1B0;transition:.2s}
.act.primary .ic{color:#2A1B04}
.act .tx b{display:block;font-size:14px;font-weight:600;letter-spacing:-.015em;color:#E7EAF0}
.act.primary .tx b{color:#241703}
.act .tx span{display:block;font-size:10px;color:#6A7180;margin-top:3px;line-height:1.3}
.act.primary .tx span{color:rgba(36,23,3,.62)}
.act.busy{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* 日志板 */
.slab.logslab{padding:16px 17px 16px;flex:1;display:flex;flex-direction:column;min-height:160px;max-height:300px}
.lh{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.lh b{font-size:9.5px;font-weight:660;letter-spacing:.13em;color:#666D7C}
.lh button{border:0;background:rgba(255,255,255,.06);color:#98A0AE;font-size:10.5px;font-weight:560;
  padding:4px 9px;border-radius:7px;font-family:inherit;cursor:pointer}
.lh button:active{background:rgba(255,255,255,.13)}
.log{flex:1;min-height:110px;overflow-y:auto;scrollbar-width:none;font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:10px;line-height:1.8;color:#77808F}
.log::-webkit-scrollbar{display:none}
.ln{white-space:pre-wrap;word-break:break-all}
.ln .tm{color:#4A515E}
.ln.ok{color:#56CFA1}
.ln.warn{color:#DCAB61}

/* 弹窗 */
.mask{position:absolute;inset:0;background:rgba(3,4,6,.62);backdrop-filter:blur(7px);display:grid;place-items:center;
  opacity:0;pointer-events:none;transition:.24s;z-index:40}
.mask.show{opacity:1;pointer-events:auto}
.mbox{width:264px;border-radius:22px;padding:24px 22px 18px;text-align:center;
  background:linear-gradient(178deg,#31343F,#1B1D25);border:1px solid rgba(255,255,255,.12);
  box-shadow:0 30px 70px -24px #000,inset 0 1px 0 rgba(255,255,255,.12);
  transform:scale(.9);transition:.3s cubic-bezier(.32,1.3,.5,1)}
.mask.show .mbox{transform:scale(1)}
.mck{width:46px;height:46px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;
  background:rgba(233,169,75,.14);border:1px solid rgba(233,169,75,.4);color:#F0B458}
.mbox h3{font-size:16px;font-weight:620;letter-spacing:-.02em}
.mbox p{font-size:11.5px;color:#9299A7;line-height:1.55;margin-top:7px}
.mbox button{width:100%;height:42px;margin-top:18px;border:0;border-radius:12px;font-family:inherit;cursor:pointer;
  background:linear-gradient(178deg,#F0B458,#D99233);color:#241703;font-size:14px;font-weight:640}
.toast{position:absolute;left:50%;bottom:44px;transform:translate(-50%,14px);padding:10px 17px;border-radius:12px;
  font-size:12.5px;font-weight:520;white-space:nowrap;background:rgba(29,31,39,.97);color:#E9ECF2;
  border:1px solid rgba(255,255,255,.12);box-shadow:0 16px 34px -14px #000;opacity:0;pointer-events:none;
  transition:.28s cubic-bezier(.32,1.2,.5,1);z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="phone">
  <div class="wall"></div>
  <div class="app">
    <header class="hd">
      <div class="d" id="dot"></div>
      <div class="nm">王者内核</div>
      <div class="sp"></div>
      <div class="fold"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg></div>
    </header>

    <div class="main">
      <!-- 主开关板 -->
      <div class="slab" id="slab">
        <div class="head">
          <div>
            <div class="k">MASTER · 主开关</div>
            <div class="big" id="big">关闭</div>
          </div>
          <div class="sw" id="sw"><i></i></div>
        </div>
        <div class="hint" id="hint">内核未加载 · 打开前请先初始化</div>
        <div class="kv">
          <div class="r"><span>内核状态</span><b id="vSt">待加载</b></div>
          <div class="r"><span>偏移项</span><b>222 项 · S45</b></div>
          <div class="r"><span>运行环境</span><b>iOS 14.4.1 · arm64</b></div>
          <div class="r"><span>悬浮球</span><b id="vBall">未挂载</b></div>
        </div>
      </div>

      <!-- 操作 -->
      <div class="acts">
        <div class="act primary" id="btnInit">
          <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2.5L4.6 13.2h6.1L10.6 21.5l8.8-11.1h-6.4z"/></svg></div>
          <div class="tx"><b id="initTxt">初始化内核</b><span>校验偏移并写入镜像</span></div>
        </div>
        <div class="act" id="btnClear">
          <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.6h5V7M6.6 7l.9 13.4h9l.9-13.4"/></svg></div>
          <div class="tx"><b>清除内核残留</b><span>移除配置与临时镜像</span></div>
        </div>
      </div>

      <!-- 日志 -->
      <div class="slab logslab">
        <div class="lh"><b>SYSTEM OUTPUT</b><button id="btnLogClear">清空</button></div>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

  <div class="mask" id="mask">
    <div class="mbox">
      <div class="mck"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.6l5.2 5.2L20 6.4"/></svg></div>
      <h3>初始化完成</h3>
      <p>内核已就绪，现在可以打开主开关</p>
      <button id="btnModalOk">好</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  var sw=document.getElementById('sw'), slab=document.getElementById('slab'), big=document.getElementById('big'),
      hint=document.getElementById('hint'), dot=document.getElementById('dot'),
      vSt=document.getElementById('vSt'), vBall=document.getElementById('vBall');
  var logEl=document.getElementById('log'), mask=document.getElementById('mask'), toastEl=document.getElementById('toast');
  var on=false, ready=false, busy=false, t1=null;

  function now(){var d=new Date(),p=function(n){return ('0'+n).slice(-2)};return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
  function add(m,c){var d=document.createElement('div');d.className='ln '+(c||'');
    var t=document.createElement('span');t.className='tm';t.textContent='['+now()+'] ';
    d.appendChild(t);d.appendChild(document.createTextNode(m));logEl.appendChild(d);
    while(logEl.children.length>90)logEl.removeChild(logEl.firstChild);logEl.scrollTop=logEl.scrollHeight;}
  function toast(s){toastEl.textContent=s;toastEl.classList.add('show');clearTimeout(t1);t1=setTimeout(function(){toastEl.classList.remove('show')},1900)}

  sw.addEventListener('click',function(){
    if(!ready){toast('请先初始化内核');add('主开关被拦截 · 内核未初始化','warn');return}
    on=!on;
    sw.classList.toggle('on',on);slab.classList.toggle('live',on);
    big.textContent=on?'开启':'关闭';
    hint.textContent=on?'内核运行中 · 悬浮球已挂载，其它参数在球内调整':'已停止 · 绘制进程已挂起';
    vSt.textContent=on?'运行中':'已停止';vSt.classList.toggle('ok',on);
    vBall.textContent=on?'已挂载':'未挂载';
    dot.classList.toggle('on',on);
    add(on?'主开关已开启 · 悬浮球已挂载':'主开关已关闭 · 绘制已停止', on?'ok':'warn');
  });

  document.getElementById('btnInit').addEventListener('click',function(){
    if(busy||ready)return;busy=true;
    var btn=this,label=document.getElementById('initTxt');
    btn.classList.add('busy');label.textContent='初始化中…';
    add('开始初始化 · 校验 S45 偏移表');
    var s=['世界 0x13E5C698 · 相机 0x138A2848','皮肤补丁 3 处 · hook 6 处','222/222 项校验通过','写入内核镜像','内核已就绪'];
    var i=0,iv=setInterval(function(){
      add(s[i],i>=s.length-1?'ok':'');i++;
      if(i>=s.length){clearInterval(iv);busy=false;ready=true;
        btn.classList.remove('busy');label.textContent='初始化内核';
        vSt.textContent='已就绪';vSt.classList.add('ok');
        dot.classList.add('on');
        mask.classList.add('show');}
    },340);
  });

  document.getElementById('btnClear').addEventListener('click',function(){
    add('清除内核残留 · 偏好 / 镜像 / 缓存','warn');
    ready=false;on=false;sw.classList.remove('on');slab.classList.remove('live');
    big.textContent='关闭';hint.textContent='内核未加载 · 打开前请先初始化';
    vSt.textContent='待加载';vSt.classList.remove('ok');vBall.textContent='未挂载';
    dot.classList.remove('on');
    setTimeout(function(){add('已清除 3 项残留 · 建议重新初始化','ok');toast('内核残留已清除')},500);
  });

  document.getElementById('btnLogClear').addEventListener('click',function(){logEl.innerHTML='';add('日志已清空')});
  document.getElementById('btnModalOk').addEventListener('click',function(){mask.classList.remove('show')});

  add('内核引导器 v4.2.1 · S45');
  add('设备 iPhone X · iOS 14.4.1 · arm64');
  add('检测到 TrollStore 环境 · 已越权');
  add('偏移表已载入 · 222 项待校验');
  add('等待初始化…');
})();
</script>
</body>
</html>
