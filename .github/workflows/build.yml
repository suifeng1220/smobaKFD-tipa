name: Build Books tipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（用于 tipa 文件名）'
        required: false
        default: '1.0.0'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install ldid
        run: brew install ldid

      - name: Build tipa
        run: bash build.sh "${{ github.event.inputs.version || '1.0.0' }}"

      - name: Upload tipa
        uses: actions/upload-artifact@v4
        with:
          name: Books-tipa
          path: packages/*.tipa
          if-no-files-found: error

      # 额外把包推到 artifacts 分支：本机没有 GitHub token，下载不了 artifact，
      # 但 git fetch 可以。这样每次构建完本地直接 git fetch origin artifacts 就能拿到 tipa。
      - name: Publish tipa to artifacts branch
        run: |
          set -e
          F=$(ls packages/*.tipa | head -1)
          echo "publishing $F"
          mkdir -p /tmp/pub
          cp "$F" /tmp/pub/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan artifacts-publish
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/pub/*.tipa .
          git add -f *.tipa
          git commit -m "tipa ${GITHUB_SHA::7} run ${GITHUB_RUN_NUMBER}"
          git push -f origin HEAD:artifacts
